<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Chặn lỗi từ VNPay Sandbox hiển thị trong Console
      window.addEventListener('error', function(e) {
        if (e.filename && e.filename.includes('vnpayment.vn')) {
          e.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && e.reason.message.includes('timer')) {
          e.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
